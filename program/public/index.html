<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vibe-gameverse</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="heading">vibe-gameverse</h1>
      </header>

      <section id="home" class="setup" hidden>
        <div class="row">
          <button type="button" id="home-new">開始新故事</button>
          <button type="button" id="home-load">載入存檔故事</button>
        </div>

        <div id="new-story" hidden>
          <p class="hint">選一套起始劇本，再填存檔顯示名。</p>
          <label class="field">
            存檔顯示名（必填，1–40 字）
            <input type="text" id="save-name" maxlength="40" placeholder="存檔顯示名" />
          </label>
          <div id="template-list" class="template-list" hidden></div>
          <div class="row">
            <button type="button" id="setup-default" disabled>開始預設劇本</button>
            <button type="button" id="setup-custom-toggle">自訂引子</button>
          </div>
          <form id="custom-form" class="custom-form" hidden>
            <p class="hint">四欄是引子，不是世界正文。生成器會具體化姓名與私密筆記。</p>
            <label>
              世界觀（必填，至少 8 字）
              <textarea id="worldview" rows="3" placeholder="這個世界的基調、規則、氣氛"></textarea>
            </label>
            <label>
              主角（可空；留空則生成無名外鄉人）
              <textarea id="protagonist" rows="2" placeholder="可留空"></textarea>
            </label>
            <label>
              補充角色（可空；留空則生成 1–3 名開場 NPC 與一條鉤子）
              <textarea id="extras" rows="2" placeholder="可留空"></textarea>
            </label>
            <label>
              起始地點（必填，至少 8 字；開場那一幕，不是地圖）
              <textarea id="starting_point" rows="2" placeholder="玩家一睜眼站在哪裡"></textarea>
            </label>
            <div class="row">
              <button type="submit" id="setup-custom-submit">生成世界</button>
            </div>
          </form>
          <p class="meta" id="setup-msg"></p>
        </div>

        <div id="load-story" hidden>
          <p class="hint">選擇一份可玩存檔。</p>
          <div id="world-list" class="world-list"></div>
          <p class="meta" id="load-msg"></p>
        </div>
      </section>

      <section id="play" hidden>
        <section id="log" class="log" aria-live="polite"></section>
        <form id="form">
          <label class="sr" for="input">你要做什麼</label>
          <textarea id="input" rows="2" placeholder="輸入回應... (Enter 送出，Shift+Enter 換行)" required></textarea>
          <div id="turn-busy" class="turn-busy" hidden aria-live="polite">
            <span class="turn-spinner" id="turn-spinner" aria-hidden="true"></span>
            <span id="turn-busy-label">處理中</span>
          </div>
          <div class="row">
            <button type="submit" id="send">送出</button>
            <button type="button" id="go-home">回到主頁</button>
            <button type="button" id="delete-world" class="danger">刪除此世界</button>
          </div>
        </form>
      </section>

      <aside id="side-dock" hidden>
        <div class="side-dock-tabs">
          <div class="side-dock-lead-tab">
            <button type="button" id="side-dock-collapse" class="side-dock-collapse" disabled aria-hidden="true" tabindex="-1" title="收合側欄" aria-label="收合側欄">&gt;&gt;</button>
          </div>
          <button type="button" id="gm-chat-toggle" aria-expanded="false" aria-controls="gm-chat-panel" title="GM">GM</button>
          <button type="button" id="debug-toggle" hidden aria-expanded="false" aria-controls="debug-panel" title="Debug">Debug</button>
        </div>
        <div class="side-dock-panels">
          <div id="gm-chat-panel" role="dialog" aria-labelledby="gm-chat-title" aria-hidden="true" hidden inert>
            <p class="gm-chat-title" id="gm-chat-title">GM</p>
            <div id="gm-chat-log" class="gm-chat-log"></div>
            <form id="gm-chat-form">
              <label class="sr" for="gm-chat-input">回覆 GM</label>
              <textarea id="gm-chat-input" rows="2" placeholder="輸入回應... (Enter 送出，Shift+Enter 換行)"></textarea>
              <button type="submit" id="gm-chat-send">送出</button>
            </form>
          </div>
          <section id="debug-panel" class="debug-panel" hidden inert>
            <p class="debug-title" id="debug-title">Debug</p>
            <div class="row">
              <button type="button" id="debug-compact">Session compact</button>
            </div>
            <p class="meta" id="debug-msg"></p>
          </section>
        </div>
      </aside>

      <dialog id="delete-dialog">
        <form method="dialog" id="delete-form" class="delete-form">
          <p>刪除目前這份世界存檔，無法復原。請輸入 <code>delete</code> 確認。</p>
          <label>
            確認字串
            <input type="text" id="delete-confirm" autocomplete="off" />
          </label>
          <p class="meta err" id="delete-msg"></p>
          <div class="row">
            <button type="submit" value="cancel">取消</button>
            <button type="button" id="delete-confirm-btn" class="danger">確認刪除</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
